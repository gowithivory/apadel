<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Forgot Password — APadel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

<div class="auth-box">
  <a href="index.html" class="auth-logo"><span class="accent">A</span>PADEL</a>
  <div class="auth-subtitle">Enter your email to receive a reset link</div>

  <form id="forgot-form">
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" class="input" placeholder="your@email.com" required>
    </div>
    <button type="submit" class="btn btn-green w-100" style="justify-content:center">Send Reset Link</button>
  </form>

  <div class="auth-footer-link">
    <a href="login.html" class="link">Back to login</a>
  </div>
</div>

<div id="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="js/app.js"></script>
<script type="module" src="js/auth.js"></script>
</body>
</html>
