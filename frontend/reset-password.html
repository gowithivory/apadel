<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password — APadel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

<div class="auth-box">
  <a href="index.html" class="auth-logo"><span class="accent">A</span>PADEL</a>
  <div class="auth-subtitle">Set a new password</div>

  <form id="reset-form">
    <div class="form-group">
      <label for="password">New Password</label>
      <input type="password" id="password" name="password" class="input" placeholder="Min 6 characters" required minlength="6">
    </div>
    <div class="form-group">
      <label for="confirm_password">Confirm Password</label>
      <input type="password" id="confirm_password" name="confirm_password" class="input" placeholder="Repeat password" required>
    </div>
    <button type="submit" class="btn btn-green w-100" style="justify-content:center">Update Password</button>
  </form>
</div>

<div id="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="js/app.js"></script>
<script type="module" src="js/auth.js"></script>
</body>
</html>
