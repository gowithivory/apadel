  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="nav" id="main-nav">
  <a href="index.html" class="nav-logo"><span class="accent">A</span>PADEL</a>
  <div class="nav-links" id="nav-links">
    <a href="index.html">Home</a>
    <a href="tournaments.html" class="active">Tournaments</a>
    <a href="rankings.html">Rankings</a>
    <a href="results.html">Results</a>
    <a href="announcements.html">News</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <div id="nav-dynamic" style="display:contents"></div>
  </div>
  <div class="nav-right" id="nav-right"></div>
  <button class="nav-hamburger" id="nav-ham" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="page-wrap">
  <div class="page-hero">
    <div class="container">
      <h1 class="page-hero-title">All <span class="accent">Tournaments</span></h1>
      <p class="page-hero-sub">Browse upcoming, ongoing and completed tournaments.</p>
    </div>
  </div>

  <section class="section">
    <div class="container">
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:24px;flex-wrap:wrap">
        <input type="text" id="search-input" class="input" placeholder="Search tournaments..." style="max-width:280px">
        <div class="filter-tabs">
          <button class="filter-tab active" data-status="all">All <span class="count" id="count-all"></span></button>
          <button class="filter-tab" data-status="registration_open">Open <span class="count" id="count-registration_open"></span></button>
          <button class="filter-tab" data-status="upcoming">Upcoming <span class="count" id="count-upcoming"></span></button>
          <button class="filter-tab" data-status="ongoing">Ongoing <span class="count" id="count-ongoing"></span></button>
          <button class="filter-tab" data-status="completed">Completed <span class="count" id="count-completed"></span></button>
        </div>
      </div>
      <div id="tournaments-grid" class="grid-3">
        <div class="spinner"></div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-logo">A<span>P</span>ADEL</div>
      <nav class="footer-links">
        <a href="tournaments.html">Tournaments</a>
        <a href="rankings.html">Rankings</a>
        <a href="results.html">Results</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="footer-social">
        <a href="#" aria-label="Instagram"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></a>
        <a href="#" aria-label="Facebook"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg></a>
      </div>
    </div>
    <div class="footer-bottom">
      <span>&copy; 2026 APadel. Egypt's Competitive Padel Ecosystem.</span>
      <span>Powered by <a href="https://ivorystudios.io" style="color:var(--green)">Ivory Studios</a></span>
    </div>

</div>
