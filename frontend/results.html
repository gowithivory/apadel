<script type="module">
  import { supabase } from './js/supabase.js';
  import { escapeHtml } from './js/app.js';

  async function _resultsInit() {
    const wrap = document.getElementById('results-wrap');

    const { data: matches } = await supabase
      .from('matches')
      .select(`
        *,
        tournament:tournaments(id, name),
        team1:registrations!matches_team1_reg_id_fkey(player1_name, player2_name),
        team2:registrations!matches_team2_reg_id_fkey(player1_name, player2_name)
      `)
      .eq('status', 'completed')
      .order('played_at', { ascending: false });

    if (!matches?.length) {
      wrap.innerHTML = '<div class="empty-state"><p>No results yet. Check back after tournaments complete.</p></div>';
      return;
    }

    const byTournament = {};
    matches.forEach(m => {
      const tid = m.tournament?.id || 'unknown';
      if (!byTournament[tid]) byTournament[tid] = { name: m.tournament?.name || 'Unknown', matches: [] };
      byTournament[tid].matches.push(m);
    });

    wrap.innerHTML = Object.values(byTournament).map(group => `
      <div class="result-tournament-block">
        <div class="result-tournament-name">${escapeHtml(group.name)}</div>
        <div class="result-cards">
          ${group.matches.map(m => {
            const t1Name = m.team1 ? escapeHtml(m.team1.player1_name + (m.team1.player2_name ? ' / ' + m.team1.player2_name : '')) : 'TBD';
            const t2Name = m.team2 ? escapeHtml(m.team2.player1_name + (m.team2.player2_name ? ' / ' + m.team2.player2_name : '')) : 'TBD';
            const win1 = m.winner_reg_id === m.team1_reg_id;
            const win2 = m.winner_reg_id === m.team2_reg_id;
            return `
              <div class="result-card">
                <div class="result-team ${win1 ? 'winner' : ''}">${t1Name}</div>
                <div class="result-score">${m.score ? escapeHtml(m.score) : 'vs'}</div>
                <div class="result-team right ${win2 ? 'winner' : ''}">${t2Name}</div>
              </div>`;
          }).join('')}
        </div>
      </div>`).join('');
  }
  if (window._appReady) _resultsInit(); else window.addEventListener('app:ready', _resultsInit);
</script>
