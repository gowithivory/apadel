<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Register — APadel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

<div class="auth-box" style="max-width:520px">
  <a href="index.html" class="auth-logo"><span class="accent">A</span>PADEL</a>
  <div class="auth-subtitle">Create your player account</div>

  <form id="register-form">
    <div class="form-group">
      <label for="full_name">Full Name</label>
      <input type="text" id="full_name" name="full_name" class="input" placeholder="Ahmed Hassan" required>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" class="input" placeholder="your@email.com" required>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="input" placeholder="Min 6 characters" required minlength="6">
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="input" placeholder="Repeat password" required>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div class="form-group">
        <label for="gender">Gender</label>
        <select id="gender" name="gender" class="input" required>
          <option value="">Select gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </div>
      <div class="form-group">
        <label for="handedness">Playing Hand</label>
        <select id="handedness" name="handedness" class="input">
          <option value="">Select</option>
          <option value="right">Right</option>
          <option value="left">Left</option>
        </select>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div class="form-group">
        <label for="phone">Phone (optional)</label>
        <input type="tel" id="phone" name="phone" class="input" placeholder="+20 100 000 0000">
      </div>
      <div class="form-group">
        <label for="origin">City / Origin (optional)</label>
        <input type="text" id="origin" name="origin" class="input" placeholder="Cairo">
      </div>
    </div>
    <button type="submit" class="btn btn-green w-100" style="justify-content:center">Create Account</button>
  </form>

  <div class="auth-footer-link">
    Already have an account? <a href="login.html" class="link">Sign in</a>
  </div>
</div>

<div id="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="js/app.js"></script>
<script type="module" src="js/auth.js"></script>
</body>
</html>
