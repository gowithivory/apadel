<div class="page-wrap">
  <div class="page-hero">
    <div class="container">
      <h1 class="page-hero-title">Edit <span class="accent">Profile</span></h1>
    </div>
  </div>

  <section class="section">
    <div class="container" style="max-width:600px">
      <div class="card">
        <div class="card-hdr">Profile Information</div>
        <div class="card-body">
          <form id="edit-profile-form">
            <div style="text-align:center;margin-bottom:24px">
              <img id="avatar-preview" src="" alt="Avatar"
                style="width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid var(--border);display:none;margin:0 auto 12px">
              <div class="form-group" style="text-align:left">
                <label>Profile Photo</label>
                <input type="file" id="avatar-input" class="input" accept="image/*">
              </div>
            </div>

            <div class="form-group">
              <label for="field-full_name">Full Name</label>
              <input type="text" id="field-full_name" class="input" required>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
              <div class="form-group">
                <label for="field-gender">Gender</label>
                <select id="field-gender" class="input">
                  <option value="">Select</option>
                  <option value="male">Male</option>
                  <option value="female">Female</option>
                </select>
              </div>
              <div class="form-group">
                <label for="field-handedness">Playing Hand</label>
                <select id="field-handedness" class="input">
                  <option value="">Select</option>
                  <option value="right">Right</option>
                  <option value="left">Left</option>
                </select>
              </div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
              <div class="form-group">
                <label for="field-phone">Phone</label>
                <input type="tel" id="field-phone" class="input" placeholder="+20 100 000 0000">
              </div>
              <div class="form-group">
                <label for="field-origin">City / Origin</label>
                <input type="text" id="field-origin" class="input" placeholder="Cairo">
              </div>
            </div>

            <div style="display:flex;gap:12px;margin-top:8px">
              <button type="submit" class="btn btn-green">Save Changes</button>
              <a href="javascript:history.back()" class="btn btn-outline">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-logo">A<span>P</span>ADEL</div>
